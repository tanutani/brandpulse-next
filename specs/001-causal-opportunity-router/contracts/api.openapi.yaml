openapi: 3.1.0
info:
  title: BrandPulse NEXT Prototype API
  version: 1.1.0
  description: >-
    Optional server endpoint for typed synthesis. Consequential gate, route, approval, and local
    persistence logic remains deterministic in shared TypeScript code.

    Version 1.1.0 narrows the request: the caller supplies only an opportunity identifier and an
    evidence version. Evidence is loaded server-side from checked-in fixtures, so no caller-authored
    prompt or caller-supplied evidence can reach the model. The 1.0.0 request shape, which accepted a
    hypothesis and an evidence array, is withdrawn for that reason.
servers:
  - url: /api
paths:
  /synthesize:
    post:
      summary: Summarize and challenge approved evidence for one opportunity
      operationId: synthesizeOpportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesisRequest'
      responses:
        '200':
          description: >-
            Structured live or fallback synthesis. Both modes satisfy the same schema, so the
            journey is identical whether or not a provider is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynthesisResponse'
        '400':
          description: >-
            Malformed body, unknown field, unknown opportunity, or unknown evidence version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Both provider and bundled fallback unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Stable machine-readable code. Provider messages, keys, and stack traces are never
            included.
          enum:
            - invalid_request
            - unknown_opportunity_or_evidence_version
            - synthesis_unavailable
    SynthesisRequest:
      type: object
      additionalProperties: false
      required: [opportunityId, evidenceVersion]
      properties:
        opportunityId:
          type: string
          maxLength: 120
          description: Must be a bundled opportunity.
        evidenceVersion:
          type: string
          maxLength: 40
          description: Must match the server's approved evidence version, e.g. `evidence-1.0.0`.
    SynthesisTheme:
      type: object
      additionalProperties: false
      required: [label, evidenceIds]
      properties:
        label: { type: string, maxLength: 80 }
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 80 }
    CounterHypothesis:
      type: object
      additionalProperties: false
      required: [claim, evidenceIds]
      properties:
        claim: { type: string, maxLength: 400 }
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 80 }
    SynthesisResponse:
      type: object
      additionalProperties: false
      description: >-
        Deliberately carries no route, score, blocker, approval, threshold, or outcome field. Every
        evidenceIds entry is verified against the approved evidence set for the opportunity; a
        response citing an unknown identifier is discarded and the fallback is returned instead.
      required: [mode, model, promptVersion, generatedAt, summary, themes, counterHypothesis, missingEvidence]
      properties:
        mode:
          type: string
          enum: [live, precomputed_fallback]
        model:
          type: [string, 'null']
          maxLength: 80
          description: Null for the checked-in fallback.
        promptVersion: { type: string, maxLength: 40 }
        generatedAt: { type: string, format: date-time }
        summary: { type: string, maxLength: 600 }
        themes:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/SynthesisTheme' }
        counterHypothesis:
          $ref: '#/components/schemas/CounterHypothesis'
        missingEvidence:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 160 }
        fallbackReason:
          type: string
          description: >-
            Present only when mode is precomputed_fallback. Provider-unavailable and abort both
            report as `timeout`: no valid answer arrived inside the six-second budget.
          enum: [disabled, missing_key, timeout, quota, invalid_output]
    SyntheticSignalEvent:
      type: object
      additionalProperties: false
      description: >-
        One event in the bundled replay. The replay is a fixed local sequence over checked-in
        fixtures; it performs no network request and reads no live feed.
      required: [id, offsetMs, sourceType, label, detail, value, evidenceIds, evidenceType, synthetic]
      properties:
        id: { type: string, maxLength: 80 }
        offsetMs: { type: integer, minimum: 0, maximum: 5000 }
        sourceType:
          type: string
          enum: [sports_news, search, consumer_language, commerce, inventory, rights]
        label: { type: string, maxLength: 80 }
        detail: { type: string, maxLength: 240 }
        value:
          oneOf:
            - { type: number }
            - { type: string, maxLength: 40 }
        delta: { type: number }
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 80 }
        evidenceType:
          type: string
          enum: [public, synthetic_internal]
        synthetic: { type: boolean }
